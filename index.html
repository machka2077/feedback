    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.5s ease;
            border: 1px solid #f0f0f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .emojis {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .emoji {
            font-size: 3rem;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            user-select: none;
            filter: grayscale(20%);
            background: none;
            border: none;
            padding: 0;
        }

        .emoji:hover {
            transform: scale(1.3);
            filter: grayscale(0%);
        }

        .hidden {
            display: none !important;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        input, textarea {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #764ba2;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #764ba2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .redirect-button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .redirect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h2 {
                font-size: 1.5rem;
            }
            .emoji {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <div id="step1">
        <h2>Как вам качество обслуживания?</h2>
        <div class="emojis" role="group" aria-label="Оценка обслуживания">
            <button class="emoji" onclick="handleRate(1)" aria-label="Очень плохо">😡</button>
            <button class="emoji" onclick="handleRate(2)" aria-label="Плохо">☹️</button>
            <button class="emoji" onclick="handleRate(3)" aria-label="Нормально">😐</button>
            <button class="emoji" onclick="handleRate(4)" aria-label="Хорошо">😊</button>
            <button class="emoji" onclick="handleRate(5)" aria-label="Отлично">😍</button>
        </div>
    </div>

    <div id="lowRating" class="hidden">
        <h2>Что мы можем улучшить?</h2>
        <form id="feedbackForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="57fe8142-ead9-4991-a913-b91135281b01">
            <input type="hidden" name="subject" value="Низкая оценка обслуживания">
            
            <input type="text" name="name" placeholder="Ваше имя" required aria-label="Имя">
            <input type="tel" name="phone" placeholder="Ваш телефон для связи" required aria-label="Телефон">
            <textarea name="message" placeholder="Опишите, что пошло не так..." required aria-label="Сообщение"></textarea>
            
            <button type="submit" id="submitBtn">Отправить отзыв</button>
            <div id="formStatus" class="status-message hidden"></div>
        </form>
    </div>

    <div id="highRating" class="hidden">
        <h2>Отлично! ❤️</h2>
        <p>Оставьте отзыв на Яндекс Картах, отправьте скриншот Вашему менеджеру. В ответ мы отправим сертификат на Бит.Ассистент</p>
        <div class="loader"></div>
        <p style="font-size: 0.8rem; color: #888;">Перенаправляем на страницу отзывов...</p>
        <button id="redirectNow" class="redirect-button">Перейти сейчас</button>
    </div>

    <noscript>
        <div style="background:#f8d7da; color:#721c24; padding:15px; border-radius:8px; margin-top:20px;">
            Для работы сайта необходим JavaScript. Пожалуйста, включите его в настройках браузера.
        </div>
    </noscript>
</div>

<script>
    (function() {
        // Константы
        const YANDEX_MAPS_URL = "https://yandex.ru/maps/org/pervy_bit/74836781634/reviews/?add-review=true&ll=39.609276%2C47.202394&mode=search&sll=39.718813%2C47.222109&sspn=0.306587%2C0.126771&tab=reviews&text=%D0%BF%D0%B5%D1%80%D0%B2%D1%8B%D0%B9%20%D0%B1%D0%B8%D1%82&z=13&utm_source=yandex&utm_medium=cpc&utm_campaign=bit_feedback";
        const REDIRECT_DELAY = 10000; // 10 секунд
        let redirectTimer = null;

        // Функция безопасного получения элемента
        function getElement(id) {
            const el = document.getElementById(id);
            if (!el) {
                console.error(`Элемент с id "${id}" не найден`);
            }
            return el;
        }

        // Обработка рейтинга
        window.handleRate = function(rating) {
            const step1 = getElement('step1');
            const lowRating = getElement('lowRating');
            const highRating = getElement('highRating');

            if (!step1 || !lowRating || !highRating) return;

            step1.classList.add('hidden');
            
            if (rating <= 3) {
                lowRating.classList.remove('hidden');
            } else {
                highRating.classList.remove('hidden');
                startRedirectTimer();
            }
        };

        // Запуск таймера редиректа
        function startRedirectTimer() {
            const highRating = getElement('highRating');
            if (!highRating) return;

            // Очищаем предыдущий таймер, если был
            if (redirectTimer) {
                clearTimeout(redirectTimer);
            }

            redirectTimer = setTimeout(() => {
                window.location.href = YANDEX_MAPS_URL;
            }, REDIRECT_DELAY);
        }

        // Немедленный редирект
        function redirectNow() {
            if (redirectTimer) {
                clearTimeout(redirectTimer);
                redirectTimer = null;
            }
            window.location.href = YANDEX_MAPS_URL;
        }

        // Навешиваем обработчики после загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            const redirectNowBtn = getElement('redirectNow');
            if (redirectNowBtn) {
                redirectNowBtn.addEventListener('click', redirectNow);
            }

            // Обработка отправки формы через AJAX
            const form = getElement('feedbackForm');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const submitBtn = getElement('submitBtn');
                    const formStatus = getElement('formStatus');
                    if (!submitBtn || !formStatus) return;

                    // Проверяем валидность формы
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    // Блокируем кнопку и показываем статус
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Отправка...';
                    formStatus.classList.add('hidden');

                    try {
                        const formData = new FormData(form);
                        const response = await fetch(form.action, {
                            method: 'POST',
                            body: formData,
                            headers: {
                                'Accept': 'application/json'
                            }
                        });

                        if (response.ok) {
                            // Успех
                            formStatus.textContent = 'Спасибо! Ваш отзыв отправлен.';
                            formStatus.className = 'status-message status-success';
                            form.reset();
                        } else {
                            throw new Error('Сервер вернул ошибку: ' + response.status);
                        }
                    } catch (error) {
                        console.error('Ошибка отправки:', error);
                        formStatus.textContent = 'Не удалось отправить отзыв. Пожалуйста, попробуйте позже или свяжитесь с нами по телефону.';
                        formStatus.className = 'status-message status-error';
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Отправить отзыв';
                        formStatus.classList.remove('hidden');
                    }
                });
            }
        });

        // Экспортируем функции для использования в inline-обработчиках
        window.redirectNow = redirectNow;
    })();
</script>

</body>
</html>
